<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Grid pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <!-- Glow -->
  <circle cx="600" cy="280" r="300" fill="rgba(59,130,246,0.08)"/>
  <!-- Lock icon -->
  <g transform="translate(560,160)">
    <rect x="0" y="30" width="80" height="60" rx="8" fill="rgba(59,130,246,0.2)" stroke="#3b82f6" stroke-width="2"/>
    <path d="M20,30 V20 A20,20 0 0,1 60,20 V30" fill="none" stroke="#3b82f6" stroke-width="3" stroke-linecap="round"/>
    <circle cx="40" cy="55" r="6" fill="#3b82f6"/>
    <line x1="40" y1="61" x2="40" y2="72" stroke="#3b82f6" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- Title -->
  <text x="600" y="310" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="bold" fill="white">69 Free Developer Tools</text>
  <text x="600" y="360" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="rgba(255,255,255,0.6)">Private. Browser-Based. No Signup.</text>
  <!-- Stats bar -->
  <g transform="translate(250,400)">
    <rect x="0" y="0" width="700" height="60" rx="12" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="100" y="25" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="rgba(255,255,255,0.5)">TOOLS</text>
    <text x="100" y="48" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="bold" fill="#3b82f6">69</text>
    <line x1="210" y1="12" x2="210" y2="48" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="280" y="25" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="rgba(255,255,255,0.5)">SERVERS</text>
    <text x="280" y="48" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="bold" fill="#22c55e">0</text>
    <line x1="380" y1="12" x2="380" y2="48" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="480" y="25" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="rgba(255,255,255,0.5)">DATA BREACHES</text>
    <text x="480" y="48" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="bold" fill="#22c55e">0</text>
    <line x1="590" y1="12" x2="590" y2="48" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="640" y="25" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="rgba(255,255,255,0.5)">100%</text>
    <text x="640" y="48" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" fill="white">CLIENT-SIDE</text>
  </g>
  <!-- Tool icons row -->
  <g transform="translate(200,500)">
    <rect x="0" y="0" width="100" height="40" rx="8" fill="rgba(59,130,246,0.15)" stroke="rgba(59,130,246,0.3)" stroke-width="1"/>
    <text x="50" y="26" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#60a5fa">{ }</text>
    <text x="55" y="26" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="rgba(255,255,255,0.7)">JSON</text>
    <rect x="120" y="0" width="100" height="40" rx="8" fill="rgba(139,92,246,0.15)" stroke="rgba(139,92,246,0.3)" stroke-width="1"/>
    <text x="170" y="26" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="rgba(255,255,255,0.7)">Base64</text>
    <rect x="240" y="0" width="100" height="40" rx="8" fill="rgba(34,197,94,0.15)" stroke="rgba(34,197,94,0.3)" stroke-width="1"/>
    <text x="290" y="26" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="rgba(255,255,255,0.7)">UUID</text>
    <rect x="360" y="0" width="100" height="40" rx="8" fill="rgba(234,179,8,0.15)" stroke="rgba(234,179,8,0.3)" stroke-width="1"/>
    <text x="410" y="26" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="rgba(255,255,255,0.7)">Regex</text>
    <rect x="480" y="0" width="100" height="40" rx="8" fill="rgba(236,72,153,0.15)" stroke="rgba(236,72,153,0.3)" stroke-width="1"/>
    <text x="530" y="26" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="rgba(255,255,255,0.7)">Hash</text>
    <rect x="600" y="0" width="100" height="40" rx="8" fill="rgba(20,184,166,0.15)" stroke="rgba(20,184,166,0.3)" stroke-width="1"/>
    <text x="650" y="26" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="rgba(255,255,255,0.7)">SQL</text>
    <rect x="720" y="0" width="100" height="40" rx="8" fill="rgba(249,115,22,0.15)" stroke="rgba(249,115,22,0.3)" stroke-width="1"/>
    <text x="770" y="26" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="rgba(255,255,255,0.7)">Docker</text>
  </g>
  <!-- Brand -->
  <text x="600" y="600" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="rgba(255,255,255,0.3)">sudheertools.github.io</text>
</svg>
